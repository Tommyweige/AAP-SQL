[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aap-sql"
version = "0.2.0"
description = "Adaptive Augmented Prompting for Text-to-SQL"
readme = "README.md"
authors = [{name = "Tung-Wei Pan"}]
keywords = ["text-to-sql", "schema-linking", "retrieval", "prompting"]
requires-python = ">=3.12"
license = {text = "Apache-2.0"}

[project.urls]
Repository = "https://github.com/Tommyweige/AAP-SQL"
Documentation = "https://github.com/Tommyweige/AAP-SQL/blob/main/docs/research-reproduction.md"
Thesis = "https://hdl.handle.net/11296/rjag8t"
Issues = "https://github.com/Tommyweige/AAP-SQL/issues"

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.2,<4"]
test = ["pytest>=8"]
dev = ["ruff>=0.11,<1", "mypy>=1.15,<2"]
research = ["google-genai>=1.68.0", "python-dotenv>=1", "numpy>=1.26", "sentence-transformers>=5.1.2", "faiss-cpu>=1.12", "tqdm>=4.64"]
training = ["sqlglot>=26", "sentence-transformers>=5.1.2"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["aap_sql*"]

[tool.setuptools.package-data]
aap_sql = ["py.typed"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
